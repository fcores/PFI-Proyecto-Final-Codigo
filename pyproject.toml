[project]
name = "medchain-ai"
version = "0.7.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "T20"]
ignore = ["S101", "S311", "B008", "UP031", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20", "B017"]
"alembic/*" = ["T20", "E501"]
"backend/blockchain/*" = ["S310"]
"backend/config.py" = ["S105"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]
