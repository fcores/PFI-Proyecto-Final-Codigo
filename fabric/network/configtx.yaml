# ─────────────────────────────────────────────────────────────────────────────
# configtx.yaml — Configuración del canal de la red MedChain.
#
# Tres organizaciones de aplicación monitorean el ciclo de vida de las
# prescripciones: el centro prescriptor (PrescriptorMSP), la empresa auditora
# MedChain (MedChainMSP) y la prepaga/financiador (PrepagaMSP).
#
# La política de endorsement del chaincode se fija explícitamente en el deploy
# (--signature-policy AND de las tres orgs); acá quedan las políticas del canal.
#
# A partir de Fabric 2.3 se usa la "Channel Participation API": ya no existe el
# system channel. El bloque de génesis se genera directamente para el canal de
# aplicación con el perfil `ChannelGenesis` y luego se une el orderer vía
# `osnadmin channel join`.
# ─────────────────────────────────────────────────────────────────────────────

################################################################################
#   Organizaciones
################################################################################
Organizations:

  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: ./organizations/ordererOrganizations/medchain.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"
    OrdererEndpoints:
      - orderer.medchain.com:7050

  - &Prescriptor
    Name: PrescriptorMSP
    ID: PrescriptorMSP
    MSPDir: ./organizations/peerOrganizations/prescriptor.medchain.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('PrescriptorMSP.admin', 'PrescriptorMSP.peer', 'PrescriptorMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('PrescriptorMSP.admin', 'PrescriptorMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('PrescriptorMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('PrescriptorMSP.peer')"

  - &MedChain
    Name: MedChainMSP
    ID: MedChainMSP
    MSPDir: ./organizations/peerOrganizations/auditoria.medchain.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('MedChainMSP.admin', 'MedChainMSP.peer', 'MedChainMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('MedChainMSP.admin', 'MedChainMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('MedChainMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('MedChainMSP.peer')"

  - &Prepaga
    Name: PrepagaMSP
    ID: PrepagaMSP
    MSPDir: ./organizations/peerOrganizations/prepaga.medchain.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('PrepagaMSP.admin', 'PrepagaMSP.peer', 'PrepagaMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('PrepagaMSP.admin', 'PrepagaMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('PrepagaMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('PrepagaMSP.peer')"

################################################################################
#   Capacidades (capabilities) — habilitan features según versión de Fabric
################################################################################
Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

################################################################################
#   Valores por defecto de la sección Application
################################################################################
Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

################################################################################
#   Valores por defecto de la sección Orderer (consenso etcdraft / Raft)
################################################################################
Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer.medchain.com:7050
  EtcdRaft:
    Consenters:
      - Host: orderer.medchain.com
        Port: 7050
        ClientTLSCert: ./organizations/ordererOrganizations/medchain.com/orderers/orderer.medchain.com/tls/server.crt
        ServerTLSCert: ./organizations/ordererOrganizations/medchain.com/orderers/orderer.medchain.com/tls/server.crt
  # Tamaño de bloque y tiempos de batch. BatchTimeout bajo porque el alta de
  # prescripciones espera el commit de forma síncrona en el request HTTP.
  BatchTimeout: 1s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"

################################################################################
#   Valores por defecto a nivel Channel
################################################################################
Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

################################################################################
#   Perfiles
################################################################################
Profiles:

  # Perfil para generar el bloque de génesis del canal de aplicación.
  #   configtxgen -profile ChannelGenesis -channelID mychannel -outputBlock <...>
  ChannelGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *Prescriptor
        - *MedChain
        - *Prepaga
      Capabilities: *ApplicationCapabilities
