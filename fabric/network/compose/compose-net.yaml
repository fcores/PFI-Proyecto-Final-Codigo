# ─────────────────────────────────────────────────────────────────────────────
# compose-net.yaml
#
# Red MedChain de 3 organizaciones:
#   - orderer.medchain.com               (servicio de ordenamiento, Raft)
#   - peer0.prescriptor.medchain.com     (PrescriptorMSP)  + couchdb.prescriptor
#   - peer0.auditoria.medchain.com       (MedChainMSP)     + couchdb.auditoria
#   - peer0.prepaga.medchain.com         (PrepagaMSP)      + couchdb.prepaga
#   - fabric-gateway                     (puente HTTP -> Fabric Gateway SDK)
#   - cli                                (contenedor de herramientas)
#
# Las variables (${IMAGE_TAG}, etc.) se leen de ../.env
# Rutas relativas a este archivo: ../  apunta a fabric/network/
# ─────────────────────────────────────────────────────────────────────────────

networks:
  pfi:
    name: ${DOCKER_NETWORK}

volumes:
  orderer.medchain.com:
  peer0.prescriptor.medchain.com:
  peer0.auditoria.medchain.com:
  peer0.prepaga.medchain.com:

services:

  # ───────────────────────────── ORDERER ─────────────────────────────
  orderer.medchain.com:
    container_name: orderer.medchain.com
    image: ${FABRIC_ORDERER_IMAGE}:${IMAGE_TAG}
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_LOGGING_SPEC=${FABRIC_LOGGING_SPEC}
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      # TLS
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      # Channel Participation API (sin system channel)
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      # Endpoint de operaciones / métricas
      - ORDERER_OPERATIONS_LISTENADDRESS=orderer.medchain.com:9443
      - ORDERER_METRICS_PROVIDER=prometheus
    working_dir: /root
    command: orderer
    volumes:
      - ../organizations/ordererOrganizations/medchain.com/orderers/orderer.medchain.com/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/medchain.com/orderers/orderer.medchain.com/tls:/var/hyperledger/orderer/tls
      - orderer.medchain.com:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "7053:7053"
      - "9443:9443"
    networks:
      - pfi

  # ──────────────────────── COUCHDB PRESCRIPTOR ──────────────────────
  couchdb.prescriptor:
    container_name: couchdb.prescriptor
    image: ${COUCHDB_IMAGE}
    labels:
      service: hyperledger-fabric
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    ports:
      - "5984:5984"
    networks:
      - pfi

  # ─────────────────────── PEER PRESCRIPTOR ──────────────────────────
  peer0.prescriptor.medchain.com:
    container_name: peer0.prescriptor.medchain.com
    image: ${FABRIC_PEER_IMAGE}:${IMAGE_TAG}
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_LOGGING_SPEC=${FABRIC_LOGGING_SPEC}
      - CORE_PEER_ID=peer0.prescriptor.medchain.com
      - CORE_PEER_ADDRESS=peer0.prescriptor.medchain.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.prescriptor.medchain.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.prescriptor.medchain.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.prescriptor.medchain.com:7051
      - CORE_PEER_LOCALMSPID=PrescriptorMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      # TLS
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      # Docker / chaincode as external service
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=${DOCKER_NETWORK}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      # Operaciones / métricas
      - CORE_OPERATIONS_LISTENADDRESS=peer0.prescriptor.medchain.com:9444
      - CORE_METRICS_PROVIDER=prometheus
      # State DB: CouchDB (requerido por las rich queries del chaincode)
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.prescriptor:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=${COUCHDB_USER}
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=${COUCHDB_PASSWORD}
      - DOCKER_API_VERSION=1.41
    working_dir: /root
    command: peer node start
    volumes:
      - ../organizations/peerOrganizations/prescriptor.medchain.com/peers/peer0.prescriptor.medchain.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/prescriptor.medchain.com/peers/peer0.prescriptor.medchain.com/tls:/etc/hyperledger/fabric/tls
      - peer0.prescriptor.medchain.com:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock
    ports:
      - "7051:7051"
      - "9444:9444"
    depends_on:
      - couchdb.prescriptor
    networks:
      - pfi

  # ───────────────────────── COUCHDB AUDITORIA ───────────────────────
  couchdb.auditoria:
    container_name: couchdb.auditoria
    image: ${COUCHDB_IMAGE}
    labels:
      service: hyperledger-fabric
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    ports:
      - "7984:5984"
    networks:
      - pfi

  # ──────────────────── PEER AUDITORIA (MedChain) ────────────────────
  peer0.auditoria.medchain.com:
    container_name: peer0.auditoria.medchain.com
    image: ${FABRIC_PEER_IMAGE}:${IMAGE_TAG}
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_LOGGING_SPEC=${FABRIC_LOGGING_SPEC}
      - CORE_PEER_ID=peer0.auditoria.medchain.com
      - CORE_PEER_ADDRESS=peer0.auditoria.medchain.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.auditoria.medchain.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.auditoria.medchain.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.auditoria.medchain.com:9051
      - CORE_PEER_LOCALMSPID=MedChainMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      # TLS
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      # Docker / chaincode
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=${DOCKER_NETWORK}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      # Operaciones / métricas
      - CORE_OPERATIONS_LISTENADDRESS=peer0.auditoria.medchain.com:9445
      - CORE_METRICS_PROVIDER=prometheus
      # State DB: CouchDB
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.auditoria:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=${COUCHDB_USER}
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=${COUCHDB_PASSWORD}
      - DOCKER_API_VERSION=1.41
    working_dir: /root
    command: peer node start
    volumes:
      - ../organizations/peerOrganizations/auditoria.medchain.com/peers/peer0.auditoria.medchain.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/auditoria.medchain.com/peers/peer0.auditoria.medchain.com/tls:/etc/hyperledger/fabric/tls
      - peer0.auditoria.medchain.com:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock
    ports:
      - "9051:9051"
      - "9445:9445"
    depends_on:
      - couchdb.auditoria
    networks:
      - pfi

  # ────────────────────────── COUCHDB PREPAGA ────────────────────────
  couchdb.prepaga:
    container_name: couchdb.prepaga
    image: ${COUCHDB_IMAGE}
    labels:
      service: hyperledger-fabric
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    ports:
      - "9984:5984"
    networks:
      - pfi

  # ─────────────────────────── PEER PREPAGA ──────────────────────────
  peer0.prepaga.medchain.com:
    container_name: peer0.prepaga.medchain.com
    image: ${FABRIC_PEER_IMAGE}:${IMAGE_TAG}
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_LOGGING_SPEC=${FABRIC_LOGGING_SPEC}
      - CORE_PEER_ID=peer0.prepaga.medchain.com
      - CORE_PEER_ADDRESS=peer0.prepaga.medchain.com:11051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:11051
      - CORE_PEER_CHAINCODEADDRESS=peer0.prepaga.medchain.com:11052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:11052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.prepaga.medchain.com:11051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.prepaga.medchain.com:11051
      - CORE_PEER_LOCALMSPID=PrepagaMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      # TLS
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      # Docker / chaincode
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=${DOCKER_NETWORK}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      # Operaciones / métricas
      - CORE_OPERATIONS_LISTENADDRESS=peer0.prepaga.medchain.com:9446
      - CORE_METRICS_PROVIDER=prometheus
      # State DB: CouchDB
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.prepaga:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=${COUCHDB_USER}
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=${COUCHDB_PASSWORD}
      - DOCKER_API_VERSION=1.41
    working_dir: /root
    command: peer node start
    volumes:
      - ../organizations/peerOrganizations/prepaga.medchain.com/peers/peer0.prepaga.medchain.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/prepaga.medchain.com/peers/peer0.prepaga.medchain.com/tls:/etc/hyperledger/fabric/tls
      - peer0.prepaga.medchain.com:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock
    ports:
      - "11051:11051"
      - "9446:9446"
    depends_on:
      - couchdb.prepaga
    networks:
      - pfi

  # ──────────────────────── FABRIC GATEWAY SVC ───────────────────────
  # Puente HTTP -> Fabric Gateway SDK. Mantiene una identidad por org y firma
  # cada transacción con el MSP correspondiente al actor que la origina.
  fabric-gateway:
    container_name: fabric-gateway
    build:
      context: ../../../fabric-gateway-svc
    image: medchain/fabric-gateway:latest
    labels:
      service: hyperledger-fabric
    environment:
      - LISTEN_ADDR=:8081
      - CHANNEL_NAME=mychannel
      - CHAINCODE_NAME=prescriptions
      - GATEWAY_AUTH_TOKEN=${GATEWAY_AUTH_TOKEN}
      - PRESCRIPTOR_MSP_ID=PrescriptorMSP
      - PRESCRIPTOR_PEER_ENDPOINT=peer0.prescriptor.medchain.com:7051
      - PRESCRIPTOR_CERT_PATH=/organizations/peerOrganizations/prescriptor.medchain.com/users/User1@prescriptor.medchain.com/msp/signcerts
      - PRESCRIPTOR_KEY_PATH=/organizations/peerOrganizations/prescriptor.medchain.com/users/User1@prescriptor.medchain.com/msp/keystore
      - PRESCRIPTOR_TLS_CERT_PATH=/organizations/peerOrganizations/prescriptor.medchain.com/peers/peer0.prescriptor.medchain.com/tls/ca.crt
      - MEDCHAIN_MSP_ID=MedChainMSP
      - MEDCHAIN_PEER_ENDPOINT=peer0.auditoria.medchain.com:9051
      - MEDCHAIN_CERT_PATH=/organizations/peerOrganizations/auditoria.medchain.com/users/User1@auditoria.medchain.com/msp/signcerts
      - MEDCHAIN_KEY_PATH=/organizations/peerOrganizations/auditoria.medchain.com/users/User1@auditoria.medchain.com/msp/keystore
      - MEDCHAIN_TLS_CERT_PATH=/organizations/peerOrganizations/auditoria.medchain.com/peers/peer0.auditoria.medchain.com/tls/ca.crt
      - PREPAGA_MSP_ID=PrepagaMSP
      - PREPAGA_PEER_ENDPOINT=peer0.prepaga.medchain.com:11051
      - PREPAGA_CERT_PATH=/organizations/peerOrganizations/prepaga.medchain.com/users/User1@prepaga.medchain.com/msp/signcerts
      - PREPAGA_KEY_PATH=/organizations/peerOrganizations/prepaga.medchain.com/users/User1@prepaga.medchain.com/msp/keystore
      - PREPAGA_TLS_CERT_PATH=/organizations/peerOrganizations/prepaga.medchain.com/peers/peer0.prepaga.medchain.com/tls/ca.crt
    volumes:
      - ../organizations:/organizations:ro
    ports:
      - "8081:8081"
    depends_on:
      - peer0.prescriptor.medchain.com
      - peer0.auditoria.medchain.com
      - peer0.prepaga.medchain.com
    networks:
      - pfi

  # ─────────────────────────────── CLI ───────────────────────────────
  # Contenedor de herramientas (peer, configtxgen, jq...) para operar la red.
  cli:
    container_name: cli
    image: ${FABRIC_TOOLS_IMAGE}:${IMAGE_TAG}
    labels:
      service: hyperledger-fabric
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - FABRIC_LOGGING_SPEC=${FABRIC_LOGGING_SPEC}
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - CORE_PEER_TLS_ENABLED=true
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - ../organizations:/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations
      - ../channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ../../../chaincode:/opt/gopath/src/github.com/hyperledger/fabric/peer/chaincode
      - ../../config:/etc/hyperledger/peercfg
    depends_on:
      - orderer.medchain.com
      - peer0.prescriptor.medchain.com
      - peer0.auditoria.medchain.com
      - peer0.prepaga.medchain.com
    networks:
      - pfi
